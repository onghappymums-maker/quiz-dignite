    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #E8003D; }
      #root { margin: 0; padding: 0; }
      #pre-splash {
        position: fixed; inset: 0; z-index: 99999;
        background: url('/splash.jpg') center center / cover no-repeat #E8003D;
        pointer-events: none;
        opacity: 1;
        transition: opacity .4s ease-in;
      }
      #pre-splash.pre-splash-fading { opacity: 0; }

      #qd-slow-network {
        display: none;
        position: fixed; inset: 0; z-index: 100000;
        background: #180810;
        color: #F7E7EE;
        flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 32px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #qd-slow-network.show { display: flex; }
      #qd-slow-network p { font-size: 15px; line-height: 1.6; max-width: 320px; margin: 14px 0 22px; color: #E8B8C6; }
      #qd-slow-network button {
        background: linear-gradient(135deg,#E8003D,#FF6B9D); color: white; border: none;
        border-radius: 50px; padding: 14px 28px; font-size: 15px; font-weight: 800; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="pre-splash"></div>
    <div id="root"></div>
    <div id="qd-slow-network">
      <div style="font-size:44px;margin-bottom:6px;">📶</div>
      <div style="font-size:18px;font-weight:800;">Le chargement prend du temps…</div>
      <p>Ça peut arriver avec une connexion lente. Vérifie ta connexion internet, puis réessaie.</p>
      <button onclick="location.reload()">🔁 Réessayer</button>
    </div>
    <script>
      // Si l'app React n'a pas signalé qu'elle est prête après 7s (bundle lent ou
      // coupure réseau), on affiche un message clair avec un vrai bouton de reprise
      // au lieu de laisser le logo de démarrage tourner indéfiniment.
      (function () {
        var SLOW_TIMEOUT = 7000;
        var shown = false;
        function showSlowBanner() {
          if (shown || window.__QD_READY) return;
          shown = true;
          var el = document.getElementById("qd-slow-network");
          if (el) el.classList.add("show");
        }
        setTimeout(showSlowBanner, SLOW_TIMEOUT);
        window.addEventListener("error", function (e) {
          // Échec de chargement d'un script (ex: bundle principal) → même message.
          if (e && e.target && e.target.tagName === "SCRIPT") showSlowBanner();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
